    <text x="1504" y="63" fill="#c0cdc6" font-size="19" text-anchor="end">V1.0.0</text>
    <text x="90" y="218" fill="#ffffff" font-size="116" font-weight="700">ClaimScope</text>
    <text x="96" y="315" fill="#ffffff" font-size="59" font-weight="700">Strong claims.</text>
    <text x="96" y="386" fill="#8ae4b7" font-size="59" font-weight="700">Exact boundaries.</text>
    <text x="96" y="457" fill="#ffffff" font-size="59" font-weight="700">Evidence first.</text>
    <text x="98" y="517" fill="#c0cdc6" font-size="26">Write the strongest claim your evidence can actually support.</text>
