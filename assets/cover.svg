<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">ClaimScope</title>
  <desc id="desc">Strong claims. Exact boundaries. Evidence first. Claim, evidence, scope and narrative form an aligned academic argument.</desc>
  <rect width="1600" height="840" fill="#151918"/>
  <path d="M96 88H1504" stroke="#3e4843" stroke-width="2"/>
