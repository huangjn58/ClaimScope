<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" role="img" aria-labelledby="title desc">
  <title id="title">ClaimScope revision workflow</title>
  <desc id="desc">Eight steps from a draft to final revision: identify the claim, check evidence, calibrate scope, remove empty defenses, preserve real boundaries and apply section-specific logic.</desc>
  <rect width="1000" height="1070" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" letter-spacing="0">
    <text x="100" y="65" font-size="32" font-weight="700" fill="#17231d">From a draft to a defensible claim.</text>
    <text x="100" y="98" font-size="19" fill="#53665b">A writing workflow. Not a mandate for additional research.</text>
    <g fill="#f1f6f3" stroke="#a2b5a9">
      <rect x="100" y="140" width="800" height="80" rx="6"/>
      <rect x="100" y="250" width="800" height="80" rx="6"/>
      <rect x="100" y="360" width="800" height="80" rx="6"/>
      <rect x="100" y="470" width="800" height="80" rx="6"/>
      <rect x="100" y="580" width="800" height="80" rx="6"/>
      <rect x="100" y="800" width="800" height="80" rx="6"/>
    </g>
    <rect x="100" y="690" width="800" height="80" rx="6" fill="#fbeef1" stroke="#bd7485"/>
    <rect x="100" y="910" width="800" height="80" rx="6" fill="#167d63"/>
    <g font-size="24" fill="#17231d">
      <text x="136" y="189">01</text><text x="209" y="189">Draft / Paragraph</text>
      <text x="136" y="299">02</text><text x="209" y="299">Identify the Claim</text>
      <text x="136" y="409">03</text><text x="209" y="409">Check the Evidence</text>
      <text x="136" y="519">04</text><text x="209" y="519">Calibrate the Scope</text>
      <text x="136" y="629">05</text><text x="209" y="629">Remove Unnecessary Defensiveness</text>
      <text x="136" y="739">06</text><text x="209" y="739">Preserve Real Scientific Boundaries</text>
      <text x="136" y="849">07</text><text x="209" y="849">Apply Section-Specific Logic</text>
      <text x="136" y="959" fill="#ffffff">08</text><text x="209" y="959" fill="#ffffff">Final Academic Revision</text>
    </g>
  </g>
  <g stroke="#53665b" stroke-width="2" fill="none">
    <path d="M500 222V243M494 237L500 243L506 237M500 332V353M494 347L500 353L506 347M500 442V463M494 457L500 463L506 457M500 552V573M494 567L500 573L506 567M500 662V683M494 677L500 683L506 677M500 772V793M494 787L500 793L506 787M500 882V903M494 897L500 903L506 897"/>
  </g>
  <text x="500" y="1035" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53665b">Narrow an unsupported claim. Never manufacture its evidence.</text>
</svg>
