<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc">
  <title id="title">ClaimScope architecture</title>
  <desc id="desc">Scientific integrity governs claim-evidence alignment, contribution narrative and scientific boundaries, section logic and reviewer response, leading to evidence-based revision.</desc>
  <rect width="1100" height="840" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" letter-spacing="0" text-anchor="middle">
    <text x="550" y="60" font-size="30" font-weight="700" fill="#17231d">An argument with a defined scope.</text>
    <text x="550" y="95" font-size="18" fill="#53665b">ClaimScope / system architecture</text>
    <rect x="270" y="130" width="560" height="80" rx="6" fill="#17231d"/>
    <text x="550" y="179" font-size="25" font-weight="700" fill="#ffffff">SCIENTIFIC INTEGRITY</text>
    <rect x="270" y="255" width="560" height="80" rx="6" fill="#e5f6ec" stroke="#167d63" stroke-width="2"/>
    <text x="550" y="304" font-size="25" font-weight="700" fill="#165b47">CLAIM–EVIDENCE ALIGNMENT</text>
