    <text x="550" y="632" font-size="24" font-weight="700" fill="#17231d">THESIS STYLE + REVIEWER RESPONSE</text>
    <rect x="230" y="708" width="640" height="80" rx="6" fill="#167d63"/>
    <text x="550" y="758" font-size="24" font-weight="700" fill="#ffffff">EVIDENCE-BASED ACADEMIC REVISION</text>
  </g>
